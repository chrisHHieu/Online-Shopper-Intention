project:
  name: online-shopper-intention
  version: 1.1.0
data:
  source_url: https://archive.ics.uci.edu/static/public/468/data.csv
  fallback_url: https://archive.ics.uci.edu/ml/machine-learning-databases/00468/online_shoppers_intention.csv
  expected_sha256: null
  raw_dir: data/raw
  processed_dir: data/processed
  raw_filename: online_shoppers_intention.csv
  user_agent: shopper-intent/1.1 (research; contact hoanghieu1642002@gmail.com)
  timeout_seconds: 30
  max_retries: 3
  min_interval_seconds: 1.0
  min_rows: 10000
  max_duplicate_fraction: 0.02
  min_positive_rate: 0.05
  max_positive_rate: 0.5
features:
  target: Revenue
  processed_filename: sessions.csv
  test_size: 0.2
  seed: 42
  numeric:
  - Administrative
  - Administrative_Duration
  - Informational
  - Informational_Duration
  - ProductRelated
  - ProductRelated_Duration
  - BounceRates
  - ExitRates
  - PageValues
  - SpecialDay
  - OperatingSystems
  - Browser
  - Region
  - TrafficType
  categorical:
    Month:
    - Feb
    - Mar
    - May
    - June
    - Jul
    - Aug
    - Sep
    - Oct
    - Nov
    - Dec
    VisitorType:
    - Returning_Visitor
    - New_Visitor
    - Other
    Weekend:
    - false
    - true
model:
  seed: 42
  cv_folds: 5
  candidates:
  - logistic
  - lightgbm
  lightgbm:
    n_estimators: 400
    learning_rate: 0.05
    num_leaves: 31
    min_child_samples: 40
    subsample: 0.9
    subsample_freq: 1
    colsample_bytree: 0.9
    reg_lambda: 1.0
    is_unbalance: true
  logistic:
    C: 1.0
    max_iter: 2000
    class_weight: balanced
  xgboost:
    n_estimators: 700
    max_depth: 5
    learning_rate: 0.05
    subsample: 0.9
    colsample_bytree: 0.9
    min_child_weight: 1.0
    reg_lambda: 1.0
    tree_method: hist
    enable_categorical: true
    scale_pos_weight: auto
  catboost:
    iterations: 500
    depth: 6
    learning_rate: 0.05
    l2_leaf_reg: 3.0
    auto_class_weights: Balanced
    eval_metric: PRAUC
    bootstrap_type: Bayesian
    subsample: 0.9
    random_strength: 1.0
    thread_count: 4
    verbose: false
    boosting_type: Plain
    one_hot_max_size: 16
business:
  value_per_conversion: 100.0
  cost_per_outreach: 1.0
  default_threshold: 0.5
  threshold_candidates: 500
  sensitivity_costs:
  - 1.0
  - 5.0
  - 10.0
  - 25.0
  - 50.0
calibration:
  method: auto
  clip_low: 0.0001
  clip_high: 0.9999
conformal:
  enabled: true
  alpha: 0.1
tuning:
  trials: 40
  fast_trials: 5
  timeout_seconds: 1800
  sampler_seed: 42
  storage: reports/optuna.db
  study_prefix: shopper-intent
  n_startup_trials: 10
  n_warmup_steps: 1
  models: null
tracking:
  enabled: false
  tracking_uri: file:./mlruns
  experiment: shopper-intent
  registered_model_prefix: shopper_intent
  champion_alias: champion
  artifact_subdir: model
registry:
  models_dir: models
  reports_dir: reports
serving:
  host: 127.0.0.1
  port: 8125
  model: lightgbm
